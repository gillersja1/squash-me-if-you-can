name: Bug report
description: Report a bug you found in Squash Me If You Can.
labels: ["bug report"]
body:
  - type: markdown
    attributes:
      value: "Thanks for hunting! One bug per report, please. Start the title with the page in brackets, like **[Gear Shop]**."
  - type: dropdown
    id: page
    attributes:
      label: Page
      options: [Hub, Gear Shop, Cart, Checkout, Stat Calculator, Party Sign-up, More than one page]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to the Gear Shop\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical (blocks a purchase or loses data), Major (wrong result), Minor (works but annoying), Cosmetic (looks or reads wrong)]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
