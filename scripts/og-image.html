<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    font-family: 'Cascadia Code', Consolas, monospace; color: #f3e9dc; overflow: hidden; position: relative;
    background:
      radial-gradient(700px 420px at 85% 20%, rgba(255,179,71,.22), transparent 65%),
      radial-gradient(600px 400px at 0% 100%, rgba(143,209,106,.14), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px),
      #120d0a;
  }
  .frame { position: absolute; inset: 28px; border: 2px solid #4a3626; border-radius: 22px; }
  .content { position: absolute; left: 80px; top: 78px; width: 760px; }
  .eyebrow { color: #8fd16a; letter-spacing: .22em; font-size: 22px; text-transform: uppercase; }
  h1 { font-size: 88px; line-height: 1.02; margin: 18px 0 22px; color: #ffb347; text-shadow: 0 0 40px rgba(255,179,71,.35); }
  p { font: 600 34px/1.35 system-ui, sans-serif; margin: 0 0 34px; color: #f3e9dc; }
  .tiers { display: flex; gap: 16px; }
  .tier { font-size: 26px; padding: 8px 22px; border: 2px solid; border-radius: 999px; }
  .easy { color: #8fd16a; } .medium { color: #ffb347; } .hard { color: #ff6b6b; }
  .bug { position: absolute; right: 70px; top: 120px; font-size: 300px; transform: rotate(18deg); filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
  .splat { position: absolute; right: 40px; top: 90px; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,179,71,.18), transparent 70%); }
  .url { position: absolute; left: 80px; bottom: 62px; font-size: 24px; color: #bfa98f; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="splat"></div>
  <div class="bug">🪲</div>
  <div class="content">
    <div class="eyebrow">A bug hunt for testers</div>
    <h1>Squash Me<br>If You Can</h1>
    <p>A dungeon gear shop with 20 bugs hidden on purpose. Can you find them all?</p>
    <div class="tiers"><span class="tier easy">8 Easy</span><span class="tier medium">7 Medium</span><span class="tier hard">5 Hard</span></div>
  </div>
  <div class="url">gillersja1.github.io/squash-me-if-you-can</div>
</body>
</html>
